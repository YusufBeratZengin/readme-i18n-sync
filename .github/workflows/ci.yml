name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run test suite with coverage (Node 20)
        if: matrix.node-version == '20.x'
        run: npm test

      - name: Require 85% source line coverage (Node 22+)
        if: matrix.node-version != '20.x'
        run: npm test -- --test-coverage-include=src/** --test-coverage-lines=85

      - name: Verify demo matches the CLI
        run: npm run demo:check

      - run: npm pack --dry-run
